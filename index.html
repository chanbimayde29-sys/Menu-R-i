<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAMMEOBEO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
overflow:hidden;
color:#ffe8a3;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#2a2a2a,#050505 65%);
}

.container{
position:relative;
z-index:2;
padding:25px;
}

.logo{
text-align:center;
margin-top:35px;
margin-bottom:25px;
}

.logo h1{
font-size:42px;
color:#fff0b8;
text-shadow:
0 0 10px gold,
0 0 25px gold;
letter-spacing:3px;
}

.logo p{
margin-top:8px;
color:white;
opacity:0.7;
font-size:14px;
}

.panel{
border:2px solid rgba(255,215,0,0.7);
border-radius:22px;
padding:20px;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(6px);
box-shadow:
0 0 15px rgba(255,215,0,0.25),
0 0 40px rgba(255,215,0,0.1);
}

.panel h2{
text-align:center;
margin-bottom:20px;
font-size:24px;
color:#ffe8a3;
}

.inject-box{
border:2px dashed gold;
border-radius:18px;
padding:28px;
text-align:center;
margin-bottom:25px;
background:rgba(255,215,0,0.04);
}

.inject-box p{
margin-bottom:15px;
color:white;
opacity:0.8;
}

.inject-box input{
color:white;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px;
margin:14px 0;
border-radius:16px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,215,0,0.1);
}

.item span{
font-size:15px;
color:#fff3c7;
}

.switch{
width:54px;
height:28px;
background:#3a3a3a;
border-radius:20px;
position:relative;
cursor:pointer;
transition:0.3s;
}

.switch::before{
content:"";
position:absolute;
width:22px;
height:22px;
border-radius:50%;
background:white;
top:3px;
left:3px;
transition:0.3s;
}

.switch.active{
background:gold;
box-shadow:0 0 15px gold;
}

.switch.active::before{
left:29px;
}

.footer{
text-align:center;
margin-top:28px;
font-size:13px;
color:rgba(255,255,255,0.5);
}

.scan{
position:fixed;
inset:0;
pointer-events:none;
background:
repeating-linear-gradient(
to bottom,
rgba(255,255,255,0.02),
rgba(255,255,255,0.02) 1px,
transparent 2px,
transparent 4px
);
animation:scanMove 6s linear infinite;
}

@keyframes scanMove{
0%{
transform:translateY(-10px);
}
100%{
transform:translateY(10px);
}
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="scan"></div>

<div class="container">

<div class="logo">
<h1>LAMMEOBEO</h1>
<p>By:trtlam</p>
</div>

<div class="panel">

<h2>MENU FF⚡️</h2>

<div class="inject-box">
<p>DATA INJECT</p>
<input type="file">
</div>

<div class="item">
<span>AimLock v1</span>
<div class="switch" onclick="toggle(this)"></div>
</div>

<div class="item">
<span>AimKiu</span>
<div class="switch" onclick="toggle(this)"></div>
</div>

<div class="item">
<span>AimHead</span>
<div class="switch" onclick="toggle(this)"></div>
</div>

<div class="item">
<span>AimBody+Định Vị</span>
<div class="switch" onclick="toggle(this)"></div>
</div>

<div class="footer">
LAMMEOBEO v12
</div>

</div>

</div>

<script>

function toggle(el){
el.classList.toggle("active");
}

</script>

</body>
</html>
